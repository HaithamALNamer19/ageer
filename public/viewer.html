<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الصورة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        #imageContainer {
            width: 100%;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        img {
            max-width: 100%;
            max-height: 100vh;
            height: auto;
            width: auto;
            display: block;
            margin: auto;
            object-fit: contain;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="imageContainer">
        <div id="loader" class="spinner"></div>
        <img id="viewImg" style="display:none;" alt="">
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/');
        const docId = pathSegments[pathSegments.length - 1];

        if (docId) {
            fetch(`/api/documents/${docId}`)
                .then(res => res.json())
                .then(doc => {
                    if (doc && doc.fileUrl) {
                        const img = document.getElementById('viewImg');
                        img.src = doc.fileUrl;
                        img.onload = () => {
                            const loader = document.getElementById('loader');
                            if (loader) loader.style.display = 'none';
                            img.style.display = 'block';
                            if (doc.personName) {
                                document.title = doc.personName;
                            }
                        };
                    } else {
                        document.getElementById('loader').style.display = 'none';
                    }
                })
                .catch(() => {
                    document.getElementById('loader').style.display = 'none';
                });
        }
    </script>
</body>
</html>
